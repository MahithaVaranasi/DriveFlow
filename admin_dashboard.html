<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – DriveFlow</title>
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .role-admin { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
        .role-user  { background: rgba(79,70,229,0.12); color: #818cf8; border: 1px solid rgba(79,70,229,0.2); }
    </style>
</head>
<body>
<div id="toast-container"></div>

<header class="header">
    <div class="header-left">
        <div class="logo-wrap">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="28" height="28" rx="8" fill="#4f46e5"/>
                <rect x="6" y="7" width="10" height="13" rx="2" fill="white" opacity="0.9"/>
                <rect x="10" y="5" width="10" height="13" rx="2" fill="#818cf8"/>
                <rect x="8" y="9" width="6" height="1.5" rx="0.75" fill="white" opacity="0.5"/>
                <rect x="8" y="12" width="4" height="1.5" rx="0.75" fill="white" opacity="0.5"/>
            </svg>
            <span class="dash-logo"><span class="logo-accent">Drive</span>Flow</span>
        </div>
    </div>
    <div class="header-right">
        <div class="theme-toggle-wrap">
            <span>🌙</span>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme"></button>
            <span>☀️</span>
        </div>
        <button id="logout-btn" class="logout-button"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
</header>

<div class="dashboard">
    <div class="admin-header">
        <div>
            <div class="admin-badge">Admin</div>
            <h2>User Management</h2>
        </div>
    </div>

    <div class="table-wrapper">
        <table id="user-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="admin_dashboard.js"></script>
</body>
</html>
