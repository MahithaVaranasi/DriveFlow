<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – DriveFlow</title>
    <link rel="stylesheet" href="loginn.css">
    <style>
        .msg { font-size: 14px; padding: 12px 16px; border-radius: 8px; margin-top: 12px; display: none; }
        .msg.success { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }
        .msg.error { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-form">
            <h2>Forgot Password</h2>
            <p>Enter your email and we'll send a reset link. <a href="loginn.html">Back to login</a></p>
            <form id="forgot-form">
                <input type="email" id="email" placeholder="Your email address" required>
                <button type="submit">Send Reset Link</button>
            </form>
            <div id="msg" class="msg"></div>
        </div>
        <div class="welcome-section">
            <h1>Reset your password.</h1>
            <p>We'll help you get back in. Check your email for the reset link.</p>
        </div>
    </div>
    <script>
        document.getElementById("forgot-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const msg = document.getElementById("msg");
            const btn = e.target.querySelector("button");
            btn.textContent = "Sending..."; btn.disabled = true;
            try {
                const res = await fetch("http://localhost:5000/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                msg.style.display = "block";
                msg.className = "msg " + (res.ok ? "success" : "error");
                msg.textContent = data.message;
                // In dev: if resetToken comes back, show reset form
                if (data.resetToken) {
                    setTimeout(() => {
                        window.location.href = "reset-password.html?token=" + data.resetToken;
                    }, 1500);
                }
            } catch {
                msg.style.display = "block";
                msg.className = "msg error";
                msg.textContent = "Server error. Please try again.";
            } finally { btn.textContent = "Send Reset Link"; btn.disabled = false; }
        });
    </script>
</body>
</html>
