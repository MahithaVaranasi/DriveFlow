<!DOCTYPE html>

    <title>DriveFlow – Document Manager</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(79,70,229,0.15);
            border: 1px solid rgba(79,70,229,0.3);
            border-radius: 40px;
            padding: 6px 16px;
            font-size: 13px;
            color: var(--glow);
            font-weight: 500;
            margin-bottom: 24px;
            letter-spacing: 0.03em;
        }
        .hero-badge::before {
            content: '●';
            font-size: 8px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .stats-row {
            display: flex;
            gap: 32px;
            margin-top: 40px;
        }
        .stat {
            display: flex;
            flex-direction: column;
        }
        .stat-number {
            font-family: 'Syne', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: white;
        }
        .stat-label {
            font-size: 12px;
            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 2px;
        }
        .hero-image-wrapper {
            position: relative;
        }
        .hero-image-wrapper::before {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(79,70,229,0.2), rgba(6,182,212,0.1));
            z-index: -1;
        }
    </style>
</head>
