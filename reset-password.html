<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – DriveFlow</title>
    <link rel="stylesheet" href="loginn.css">
    <style>
        .msg { font-size: 14px; padding: 12px 16px; border-radius: 8px; margin-top: 12px; display: none; }
        .msg.success { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }
        .msg.error { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-form">
            <h2>Reset Password</h2>
            <p>Enter your new password below. <a href="loginn.html">Back to login</a></p>
            <form id="reset-form">
                <input type="password" id="newPassword" placeholder="New password (min 6 chars)" required minlength="6">
                <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                <button type="submit">Reset Password</button>
            </form>
            <div id="msg" class="msg"></div>
        </div>
        <div class="welcome-section">
            <h1>Choose a new password.</h1>
            <p>Make it strong and unique. You'll use it to log in next time.</p>
        </div>
    </div>
    <script>
        const token = new URLSearchParams(window.location.search).get("token");
        if (!token) { document.getElementById("msg").style.display = "block"; document.getElementById("msg").className = "msg error"; document.getElementById("msg").textContent = "Invalid or missing reset token."; }

        document.getElementById("reset-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const msg = document.getElementById("msg");
            const btn = e.target.querySelector("button");

            if (newPassword !== confirmPassword) {
                msg.style.display = "block"; msg.className = "msg error"; msg.textContent = "Passwords do not match."; return;
            }
            btn.textContent = "Resetting..."; btn.disabled = true;
            try {
                const res = await fetch("http://localhost:5000/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();
                msg.style.display = "block";
                msg.className = "msg " + (res.ok ? "success" : "error");
                msg.textContent = data.message;
                if (res.ok) setTimeout(() => window.location.href = "loginn.html", 2000);
            } catch {
                msg.style.display = "block"; msg.className = "msg error"; msg.textContent = "Server error.";
            } finally { btn.textContent = "Reset Password"; btn.disabled = false; }
        });
    </script>
</body>
</html>
